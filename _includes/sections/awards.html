<section class="section" id="awards" data-shape="star">
  <div class="section__head">
    <div>
      <p class="badge reveal" style="--d: 120ms">Recognition</p>
      <h2 class="headline reveal" style="--d: 180ms">Awards &amp;<br />milestones.</h2>
    </div>
    <p class="lede screen__aside reveal" style="--d: 220ms">
      Hackathons, competitions and a published paper along the way.
    </p>
  </div>

  <ol class="panel glass glass--soft panel--wide">
    {% for award in site.data.awards %}
    <li class="panel__row award reveal" style="--d: {{ forloop.index0 | times: 110 | plus: 200 }}ms">
      <span class="panel__index">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
      <div class="award__main">
        <div>
          <h3 class="panel__title">{{ award.title }}</h3>
          <p class="panel__text">{{ award.description }}</p>
        </div>
        <p class="award__highlight">{{ award.highlight }}</p>
      </div>
    </li>
    {% endfor %}
  </ol>
</section>
