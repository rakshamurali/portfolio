<section class="section" id="skills" data-shape="braces">
  <div class="section__head">
    <div>
      <p class="badge reveal" style="--d: 120ms">Toolkit</p>
      <h2 class="headline reveal" style="--d: 180ms">What I<br />work with.</h2>
    </div>
    <p class="lede screen__aside reveal" style="--d: 220ms">
      A focused stack, sharpened on real production apps.
    </p>
  </div>

  <div class="skills glass glass--soft">
    {% for category in site.data.skills.categories %}
    <div class="skills__col reveal" style="--d: {{ forloop.index0 | times: 110 | plus: 200 }}ms">
      <p class="mono-label">{{ forloop.index | prepend: '0' | slice: -2, 2 }} / {{ category.title }}</p>
      <ul class="chips">
        {% for skill in category.skills %}
        <li class="chip">{{ skill.name }}</li>
        {% endfor %}
      </ul>
    </div>
    {% endfor %}
  </div>
</section>
