<footer class="footer">
  <div class="footer__row">
    <a href="{{ '/' | relative_url }}" class="nav__logo" aria-label="{{ site.data.personal.name }}, home">
      {% include icon.html name="hexagon" size=20 stroke=1.5 %}
      <span>raksha<span class="nav__logo-dim">.m</span></span>
    </a>

    <ul class="footer__links">
      <li><a href="mailto:{{ site.email }}">Email</a></li>
      <li><a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ site.github }}" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
    </ul>

    <button class="footer__top" id="back-to-top" type="button">
      Back to top {% include icon.html name="arrow-up" size=14 %}
    </button>
  </div>

  <p class="footer__meta">
    &copy; {{ 'now' | date: '%Y' }} {{ site.data.personal.name }} · {{ site.data.personal.location }} ·
    Built with Jekyll, crafted with a touch of AI.
  </p>
</footer>
